<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>micro — a composed nostr client</title>
<meta name="description" content="A microblogging nostr client composed entirely from independent no-build components.">
<link rel="stylesheet" href="https://nostr-client.github.io/theme/theme.css">
<style>
  body { max-width: 40rem; margin: 0 auto; padding: 0 1rem 5rem; }
  header { display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; padding: 1rem 0; flex-wrap: wrap; position: sticky; top: 0;
    background: color-mix(in srgb, var(--nc-bg) 88%, transparent);
    backdrop-filter: blur(8px); z-index: 5;
    border-bottom: 1px solid var(--nc-line); }
  header h1 { font-size: 1.15rem; margin: 0; }
  header h1 a { text-decoration: none; color: inherit; }
  header h1 .accent { color: var(--nc-accent); }
  nav { display: flex; gap: .25rem; margin: 1rem 0; flex-wrap: wrap; }
  nav button { font: inherit; font-size: .9rem; cursor: pointer; border: none;
    background: none; color: var(--nc-soft); padding: .4em .95em; border-radius: 999px; }
  nav button.active { background: var(--nc-accent-soft); color: var(--nc-accent); font-weight: 650; }
  nav button:hover:not(.active) { background: var(--nc-inset); }
  .view { display: none; } .view.active { display: block; }
  nostr-composer { margin-bottom: 1rem; }
  #following-empty, .quiet { color: var(--nc-soft); padding: 2rem 0; text-align: center; }
  .back { font: inherit; cursor: pointer; border: none; background: none;
    color: var(--nc-soft); padding: 0 0 .9rem; font-size: .9rem; }
  .back:hover { color: var(--nc-ink); }
  footer { margin-top: 3rem; font-size: .78rem; color: var(--nc-faint); text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1><a href="https://github.com/nostr-client/micro"><span class="accent">▲</span> micro</a></h1>
  <nostr-login></nostr-login>
</header>

<nav id="tabs">
  <button data-view="global" class="active">Global</button>
  <button data-view="following">Following</button>
  <button data-view="mentions">Mentions</button>
  <button data-view="search">Search</button>
  <button data-view="profile">Profile</button>
  <button data-view="relays">Relays</button>
</nav>

<div class="view active" id="view-global">
  <nostr-composer placeholder="What's happening?"></nostr-composer>
  <nostr-feed limit="30"></nostr-feed>
</div>

<div class="view" id="view-following">
  <div id="following-empty">Log in to see notes from people you follow.</div>
  <nostr-feed id="following-feed" limit="30" authors="none" hidden></nostr-feed>
</div>

<div class="view" id="view-mentions">
  <nostr-notifications></nostr-notifications>
</div>

<div class="view" id="view-search">
  <nostr-search></nostr-search>
</div>

<div class="view" id="view-profile">
  <nostr-profile-editor></nostr-profile-editor>
  <p class="quiet" style="text-align:left">Your follows:</p>
  <nostr-contacts></nostr-contacts>
</div>

<div class="view" id="view-relays">
  <nostr-relay-manager></nostr-relay-manager>
</div>

<div class="view" id="view-thread">
  <button class="back" id="back">← back</button>
  <nostr-thread id="thread"></nostr-thread>
</div>

<footer>
  composed from <a href="https://nostr-client.github.io/">nostr-client</a> parts —
  login · composer · feed · thread · note · reactions · notifications · contacts ·
  profile-editor · relay-manager · pool — no build, no bundler, 100% vanilla JS.
  prefer calm? try <a href="https://nostr-client.github.io/zen/">zen</a>
</footer>

<script type="module">
  import { applySavedRelays } from 'https://nostr-client.github.io/relay-manager/relay-manager.js'
  applySavedRelays() // restore the user's relay choices before anything subscribes

  import('https://nostr-client.github.io/reactions/reactions.js') // notes grow reaction bars
  await Promise.all([
    import('https://nostr-client.github.io/login/login.js'),
    import('https://nostr-client.github.io/composer/composer.js'),
    import('https://nostr-client.github.io/feed/feed.js'),
    import('https://nostr-client.github.io/thread/thread.js'),
    import('https://nostr-client.github.io/notifications/notifications.js'),
    import('https://nostr-client.github.io/search/search.js'),
    import('https://nostr-client.github.io/contacts/contacts.js'),
    import('https://nostr-client.github.io/profile-editor/profile-editor.js'),
  ])
  const { parseRefs } = await import('https://nostr-client.github.io/thread/thread.js')
  const { defaultPool } = await import('https://nostr-client.github.io/pool/pool.js')

  // ---- tabs + thread as a routable view
  const tabs = document.querySelectorAll('nav button')
  let currentTab = 'global'
  function show(view) {
    for (const t of tabs) t.classList.toggle('active', t.dataset.view === view)
    for (const v of document.querySelectorAll('.view')) {
      v.classList.toggle('active', v.id === 'view-' + view)
    }
  }
  for (const tab of tabs) {
    tab.onclick = () => {
      currentTab = tab.dataset.view
      if (location.hash) history.pushState({}, '', location.pathname)
      show(currentTab)
    }
  }

  const thread = document.getElementById('thread')
  function openThread(id) {
    thread.setAttribute('event-id', id)
    show('thread')
    history.pushState({ thread: id }, '', '#' + id)
    scrollTo(0, 0)
  }
  const HEX = /^[0-9a-f]{64}$/
  document.getElementById('back').onclick = () => history.back()
  addEventListener('popstate', () => {
    const id = location.hash.slice(1)
    if (HEX.test(id)) { thread.setAttribute('event-id', id); show('thread') }
    else show(currentTab)
  })
  document.addEventListener('nostr:note-click', (e) => {
    const target = e.detail.targetId ?? parseRefs(e.detail.event).root ?? e.detail.event.id
    openThread(target)
  })
  document.addEventListener('nostr:hashtag-click', (e) => {
    currentTab = 'search'
    show('search')
    document.querySelector('nostr-search').search('#' + e.detail.tag)
    scrollTo(0, 0)
  })
  const initial = location.hash.slice(1)
  if (/^[0-9a-f]{64}$/.test(initial)) { thread.setAttribute('event-id', initial); show('thread') }

  // ---- following feed from the kind-3 contact list
  const followingFeed = document.getElementById('following-feed')
  const followingEmpty = document.getElementById('following-empty')

  async function loadFollowing(pubkey) {
    const contacts = await defaultPool().get({ kinds: [3], authors: [pubkey] })
    const follows = (contacts?.tags ?? [])
      .filter((t) => t[0] === 'p' && /^[0-9a-f]{64}$/.test(t[1] ?? ''))
      .map((t) => t[1])
    if (follows.length) {
      followingEmpty.hidden = true
      followingFeed.hidden = false
      followingFeed.setAttribute('authors', follows.slice(0, 500).join(','))
    } else {
      followingEmpty.textContent = 'No follows yet — find people in Global.'
      followingEmpty.hidden = false
      followingFeed.hidden = true
    }
  }

  window.addEventListener('nostr:login', (e) => loadFollowing(e.detail.pubkey))
  window.addEventListener('nostr:contacts-changed', () => window.nostrPubkey && loadFollowing(window.nostrPubkey))
  window.addEventListener('nostr:logout', () => {
    followingEmpty.textContent = 'Log in to see notes from people you follow.'
    followingEmpty.hidden = false
    followingFeed.hidden = true
    followingFeed.setAttribute('authors', 'none')
  })
  if (window.nostrPubkey) loadFollowing(window.nostrPubkey)
</script>
</body>
</html>
